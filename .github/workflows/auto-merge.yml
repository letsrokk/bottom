name: Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  disable:
    name: Revoke unsafe auto-merge
    if: >-
      github.event.action == 'converted_to_draft' ||
      (github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disable auto-merge and revoke fork approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          auto_merge_enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [[ "$auto_merge_enabled" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi

          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            label_present=$(gh pr view "$PR_URL" --json labels --jq 'any(.labels[]; .name == "automerge")')
            if [[ "$label_present" == "true" ]]; then
              gh pr edit "$PR_URL" --remove-label automerge
            fi
          fi

  enable:
    name: Enable trusted auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      ((github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'labeled') ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'automerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge --auto --squash "$PR_URL"
          --match-head-commit "$HEAD_SHA"
